name: Daily Racecards & Tips Update

on:
  schedule:
    - cron: '30 7 * * *'   # 07:30 UTC every day
  workflow_dispatch:        # allows manual runs

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape Today and Tomorrow & Generate Tips
        run: |
          python scrape_racecards.py --date today
          python generate_tips.py --date today
          python scrape_racecards.py --date tomorrow
          python generate_tips.py --date tomorrow

      - name: Commit and push updated JSON files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add racecards-*.json tips-*.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update racecards and tips"
          git pull --rebase origin main
          git push origin main


