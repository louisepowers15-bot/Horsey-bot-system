name: Update tips and results

on:
  schedule:
    # Morning: scrape cards + first tips of the day (frozen after this)
    - cron: "30 7 * * *"
    # Backup morning tips (if 07:30 ran before cards published, this fills the day)
    - cron: "0 9 * * *"
    # Optional: refresh racecards only (odds on site data) — does NOT rewrite tips
    - cron: "0 10 * * *"
    # Results + settle
    - cron: "0 16 * * *"
    - cron: "15 21 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "tips (first of day) | cards (no tips) | results | both | force-tips"
        required: true
        default: both
        type: choice
        options:
          - tips
          - cards
          - results
          - both
          - force-tips

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          # Robust mode pick: cron expression match is unreliable on GitHub;
          # also branch on UTC hour so morning tips always run.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            CRON="${{ github.event.schedule }}"
            echo "UTC hour=$HOUR cron='$CRON'"
            if [ "$CRON" = "0 10 * * *" ] || [ "$HOUR" = "10" ]; then
              echo "mode=cards" >> $GITHUB_OUTPUT
            elif [ "$CRON" = "30 7 * * *" ] || [ "$CRON" = "0 9 * * *" ] || [ "$HOUR" = "07" ] || [ "$HOUR" = "08" ] || [ "$HOUR" = "09" ]; then
              echo "mode=tips" >> $GITHUB_OUTPUT
            else
              echo "mode=results" >> $GITHUB_OUTPUT
            fi
          fi
          echo "UTC now: $(date -u)"

      - name: Morning – cards + first tips (frozen)
        if: steps.mode.outputs.mode == 'tips' || steps.mode.outputs.mode == 'both'
        run: |
          python scrape_racecards.py --date today
          # Empty/unpublished tips files are overwritten; non-empty stay frozen
          python generate_tips.py --date today
          # If still empty (card late), one more scrape+generate pass
          python - <<'PY'
          import json, pathlib, subprocess, sys
          from datetime import date
          t = pathlib.Path(f"tips-{date.today().isoformat()}.json")
          n = 0
          if t.exists():
              try:
                  n = len(json.loads(t.read_text()).get("races") or [])
              except Exception:
                  n = 0
          if n < 1:
              print("Tips still empty — re-scrape and generate once more")
              subprocess.check_call([sys.executable, "scrape_racecards.py", "--date", "today"])
              subprocess.check_call([sys.executable, "generate_tips.py", "--date", "today"])
          PY
          python - <<'PY'
          import json, pathlib, sys
          from datetime import date
          p = pathlib.Path(f"racecards-{date.today().isoformat()}.json")
          t = pathlib.Path(f"tips-{date.today().isoformat()}.json")
          if not p.exists():
              print("FAIL: no racecards"); sys.exit(1)
          n = sum(len(m.get("races") or []) for m in json.loads(p.read_text()).get("meetings") or [])
          print(f"Health racecards: {n} races")
          if n < 1:
              sys.exit(1)
          if not t.exists() or not json.loads(t.read_text()).get("races"):
              print("FAIL: no tips after morning run"); sys.exit(1)
          print("Health OK — tips frozen for the day")
          PY
          python scrape_racecards.py --date tomorrow || true
          python generate_tips.py --date tomorrow || true

      - name: Force regenerate tips (manual only)
        if: steps.mode.outputs.mode == 'force-tips'
        run: |
          python scrape_racecards.py --date today
          python generate_tips.py --date today --force
          echo "Forced tip overwrite complete"

      - name: Mid-morning – racecards only (tips untouched)
        if: steps.mode.outputs.mode == 'cards'
        run: |
          python scrape_racecards.py --date today || true
          echo "Cards refreshed; tips file left as-is (frozen)"

      - name: Evening – results, settle, history (no tip generation)
        if: steps.mode.outputs.mode == 'results' || steps.mode.outputs.mode == 'both'
        run: |
          python scrape_results.py --date yesterday || true
          python settle_tips.py --date yesterday || true
          python scrape_results.py --date today || true
          python settle_tips.py --date today || true
          python history_store.py --rebuild-day yesterday || true
          python history_store.py --rebuild-day today || true
          python history_store.py --archive --keep-days 14 || true
          test -f leaderboard.json
          python - <<'PY'
          import json, pathlib
          lb = json.loads(pathlib.Path("leaderboard.json").read_text())
          print("last_settled=", lb.get("last_settled"))
          PY

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add racecards-*.json tips-*.json results-*.json settled-*.json leaderboard.json status.json history/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No file changes"
            exit 0
          fi
          git commit -m "Auto-update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin main
