name: Daily Racecards & Tips Update

on:
  schedule:
    - cron: "30 7 * * *"    # 07:30 UTC morning cards + tips
    - cron: "0 10 * * *"    # 10:00 UTC quick refresh (cards/odds drift)
    - cron: "0 16 * * *"    # 16:00 UTC mid-afternoon partial results settle
    - cron: "15 21 * * *"   # 21:15 UTC full results + history + settle
    - cron: "0 23 * * *"    # 23:00 UTC late re-settle (catch late results)
  workflow_dispatch:
    inputs:
      mode:
        description: "tips | results | both"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - tips
          - results

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 7 * * *" ] || [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
            echo "mode=tips" >> $GITHUB_OUTPUT
          else
            # 16:00 / 21:15 / 23:00 → results + settle (idempotent)
            echo "mode=results" >> $GITHUB_OUTPUT
          fi
          echo "UTC now: $(date -u)"

      - name: Morning – scrape + tips
        if: steps.mode.outputs.mode == 'tips' || steps.mode.outputs.mode == 'both'
        run: |
          python scrape_racecards.py --date today
          python generate_tips.py --date today
          python scrape_racecards.py --date tomorrow
          python generate_tips.py --date tomorrow

      - name: Evening – results, settle, history, archive
        if: steps.mode.outputs.mode == 'results' || steps.mode.outputs.mode == 'both'
        run: |
          python scrape_results.py --date yesterday || true
          python settle_tips.py --date yesterday || true
          python scrape_results.py --date today || true
          python settle_tips.py --date today || true
          # Build long-term history the bots can query
          python history_store.py --rebuild-day yesterday || true
          python history_store.py --rebuild-day today || true
          # Keep only last 3 days of day-files in repo root; older → history/archive/
          python history_store.py --archive --keep-days 3

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add racecards-*.json tips-*.json results-*.json settled-*.json leaderboard.json history/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No file changes"
            exit 0
          fi
          git commit -m "Auto-update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin main
