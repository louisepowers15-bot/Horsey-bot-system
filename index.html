<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horse Racing Bot Chat</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --card-hover: #334155;
      --text: #e2e8f0; --muted: #94a3b8; --border: #334155; --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 1rem; }
    header { text-align: center; padding: 1.25rem 0 0.75rem; }
    header h1 {
      font-size: 1.7rem; font-weight: 700; color: var(--accent);
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    header .meta { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
    .info-box {
      background: #1e3a5f; border: 1px solid #334155; border-radius: 0.75rem;
      padding: 0.85rem 1.1rem; margin: 1rem 0; font-size: 0.88rem; color: #bae6fd;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    .tab {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      padding: 0.45rem 0.95rem; border-radius: 9999px; cursor: pointer; font-size: 0.85rem;
    }
    .tab:hover { background: var(--card-hover); color: var(--text); }
    .tab.active { background: #0ea5e9; color: white; border-color: #0ea5e9; }

    .meeting {
      margin-bottom: 0.65rem; border: 1px solid var(--border);
      border-radius: 0.75rem; overflow: hidden; background: var(--card);
    }
    .meeting-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.95rem 1.15rem; cursor: pointer; background: #1e293b;
      font-size: 1.2rem; font-weight: 700; color: #f1f5f9; user-select: none;
    }
    .meeting-header:hover { background: #273548; }
    .meeting-header .chevron { transition: transform 0.2s; color: var(--muted); }
    .meeting.open .meeting-header .chevron { transform: rotate(90deg); }
    .meeting-body { display: none; border-top: 1px solid var(--border); }
    .meeting.open .meeting-body { display: block; }

    .race { border-bottom: 1px solid var(--border); }
    .race:last-child { border-bottom: none; }
    .race-header {
      padding: 0.65rem 1.15rem; font-size: 0.9rem; color: #cbd5e1;
      background: #0f172a; border-bottom: 1px solid #1e293b;
      display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: baseline;
    }
    .race-time { font-weight: 700; color: #38bdf8; font-size: 1rem; }
    .race-name { font-weight: 500; }

    .col-headers {
      display: grid; grid-template-columns: 130px 1fr 70px 60px 55px;
      gap: 0.5rem; padding: 0.4rem 1.15rem; font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
      background: #0f172a; border-bottom: 1px solid #1e293b;
    }
    .tip {
      display: grid; grid-template-columns: 130px 1fr 70px 60px 55px;
      gap: 0.5rem; align-items: center; padding: 0.5rem 1.15rem;
      border-bottom: 1px solid #1e293b; cursor: pointer;
    }
    .tip:last-child { border-bottom: none; }
    .tip:hover { background: var(--card-hover); }
    .bot-badge {
      font-size: 0.72rem; font-weight: 600; padding: 0.18rem 0.45rem;
      border-radius: 9999px; color: white; text-align: center; white-space: nowrap;
    }
    .horse-name { font-weight: 500; font-size: 0.95rem; }
    .stars { color: #fbbf24; letter-spacing: 1px; text-align: center; }
    .odds { font-weight: 600; color: #fbbf24; text-align: right; }
    .confidence {
      font-size: 0.78rem; font-weight: 600; padding: 0.12rem 0.4rem;
      border-radius: 9999px; text-align: center;
    }
    .conf-high { background: #166534; color: #bbf7d0; }
    .conf-mid  { background: #854d0e; color: #fef08a; }
    .conf-low  { background: #7f1d1d; color: #fecaca; }
    .ew-flag {
      font-size: 0.65rem; background: #4c1d95; color: #e9d5ff;
      padding: 0.08rem 0.35rem; border-radius: 4px; margin-left: 0.3rem;
    }
    .reason-panel {
      display: none; grid-column: 1 / -1; background: #0f172a;
      border-top: 1px solid #334155; padding: 0.75rem 1rem;
      font-size: 0.88rem; color: #cbd5e1; line-height: 1.5;
    }
    .tip.open .reason-panel { display: block; }
    .reason-panel strong { color: #e2e8f0; }

    .section-title { font-size: 1.1rem; font-weight: 600; margin: 1.25rem 0 0.75rem; color: #f1f5f9; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem;
      padding: 1rem 1.15rem; margin-bottom: 0.75rem;
    }
    .card h3 { font-size: 0.95rem; color: #38bdf8; margin-bottom: 0.35rem; }
    .card p { font-size: 0.9rem; color: #cbd5e1; }
    .hot-pick { border-color: #38bdf8; }
    .consensus-bar {
      background: linear-gradient(90deg, #0c4a6e 0%, #164e63 100%);
      border: 1px solid #38bdf8; border-radius: 10px;
      padding: 0.75rem 1rem; margin: 0.5rem 0 0.75rem;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
    }
    .consensus-bar .c-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; color: #7dd3fc; font-weight: 700; }
    .consensus-bar .c-horse { font-size: 1.05rem; font-weight: 700; color: #f8fafc; }
    .consensus-bar .c-meta { font-size: 0.85rem; color: #cbd5e1; }
    .consensus-bar.strong { border-color: #4ade80; background: linear-gradient(90deg, #14532d 0%, #164e63 100%); }
    .consensus-bar.solid { border-color: #38bdf8; }
    .consensus-bar.lean { border-color: #fbbf24; }
    .consensus-bar.split { border-color: #64748b; }

    .chat-line { display: flex; gap: 0.6rem; margin-bottom: 0.7rem; align-items: flex-start; }
    .chat-bubble { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 0.55rem 0.8rem; font-size: 0.9rem; color: #cbd5e1; flex: 1; }
    .chat-bubble strong { color: #e2e8f0; }
    .footer { text-align: center; padding: 2rem 0; color: var(--muted); font-size: 0.8rem; }
    @media (max-width: 640px) {
      .col-headers, .tip { grid-template-columns: 100px 1fr 55px 50px 48px; }
      .bot-badge { font-size: 0.65rem; }
    }
  
  .data-warn {
    background: #3d2914; border: 1px solid #c47b2c; color: #f0d9b5;
    padding: 12px 16px; border-radius: 10px; margin: 12px 0; font-size: 0.95rem; line-height: 1.45;
  }

    .lb-period-tabs { display:flex; flex-wrap:wrap; gap:0.4rem; margin:0.75rem 0 1rem; }
    .lb-period-tabs button {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      padding: 0.35rem 0.85rem; border-radius: 9999px; cursor: pointer; font-size: 0.8rem;
    }
    .lb-period-tabs button.active { background:#0ea5e9; color:#fff; border-color:#0ea5e9; }
    .lb-table th, .lb-table td { padding: 0.55rem 0.5rem; border-bottom: 1px solid var(--border); }
    .lb-table tr.lb-best-roi { background: linear-gradient(90deg, rgba(234,179,8,0.18), transparent); }
    .lb-table tr.lb-best-win { box-shadow: inset 3px 0 0 #38bdf8; }
    .lb-crown { margin-left: 0.35rem; font-size: 0.95rem; }
    .lb-pill {
      display:inline-block; font-size:0.7rem; font-weight:700; padding:0.1rem 0.45rem;
      border-radius:9999px; margin-left:0.35rem; vertical-align:middle;
    }
    .lb-pill-gold { background:#854d0e; color:#fef08a; }
    .lb-pill-blue { background:#0c4a6e; color:#bae6fd; }
    .lb-roi-pos { color:#4ade80; font-weight:600; }
    .lb-roi-neg { color:#f87171; font-weight:600; }
    .lb-podium {
      display:grid; grid-template-columns:1fr; gap:0.5rem; margin:0.75rem 0 1rem;
    }
    @media (min-width:640px){ .lb-podium { grid-template-columns:1fr 1fr; } }
    .lb-podium-card {
      background: var(--card); border:1px solid var(--border); border-radius:0.75rem;
      padding:0.85rem 1rem;
    }
    .lb-podium-card h3 { font-size:0.8rem; color:var(--muted); font-weight:600; margin-bottom:0.35rem; }
    .lb-podium-card .val { font-size:1.15rem; font-weight:700; }

  
    /* Mobile polish */
    @media (max-width: 640px) {
      header h1 { font-size: 1.35rem; }
      .tabs { gap: 0.35rem; }
      .tab { padding: 0.55rem 0.85rem; font-size: 0.8rem; }
      .meeting-header { padding: 1rem 0.9rem; font-size: 1.05rem; min-height: 48px; }
      .race-header { padding: 0.75rem 0.9rem; }
      .tip-card { padding: 0.85rem; }
      .lb-table { font-size: 0.82rem; }
      .lb-table th, .lb-table td { padding: 0.5rem 0.35rem; }
    }
    .going-banner {
      display: inline-block; margin-left: 0.5rem; font-size: 0.75rem; font-weight: 600;
      padding: 0.15rem 0.55rem; border-radius: 9999px; background: #1e3a5f; color: #bae6fd;
    }
    .going-banner.soft { background: #3b1f5e; color: #e9d5ff; }
    .going-banner.firm { background: #7c2d12; color: #fed7aa; }
    .going-banner.heavy { background: #4c1d95; color: #ddd6fe; }
    .sparkline { display:flex; align-items:flex-end; gap:3px; height:40px; margin:0.75rem 0 0.25rem; }
    .sparkline span {
      flex:1; min-width:6px; border-radius:3px 3px 0 0; background:#334155;
    }
    .sparkline span.pos { background:#22c55e; }
    .sparkline span.neg { background:#ef4444; }
    .cal-grid { display:grid; grid-template-columns:1fr; gap:0.5rem; margin:0.75rem 0; }
    @media (min-width:640px){ .cal-grid { grid-template-columns:1fr 1fr 1fr; } }
    .cal-card {
      background: var(--card); border:1px solid var(--border); border-radius:0.65rem; padding:0.7rem 0.85rem;
      font-size:0.82rem;
    }
    .cal-card .lbl { color:var(--muted); font-size:0.75rem; }
    .cal-card .num { font-weight:700; font-size:1.05rem; margin-top:0.15rem; }
    .hot-card {
      background: linear-gradient(135deg, #1e293b, #0f172a); border:1px solid #334155;
      border-radius:0.75rem; padding:0.9rem 1rem; margin:0.75rem 0 1rem;
    }
    .hot-card h3 { font-size:0.85rem; color:#fbbf24; margin-bottom:0.35rem; }

  </style>

</head>
<body>
  <div class="container">
    <header>
      <h1><span>🏇</span> Horse Racing Bot Chat</h1>
      <div class="meta" id="header-meta">UK & Ireland · Loading…</div>
    </header>

    <div class="info-box">
      Blue/green bar on each race = what to back (most bots agree) · Stars = bots on that horse · Hot Pick tab = best of the day · Click a tip for reasoning
    </div>

    <div class="tabs" id="main-tabs">
      <button class="tab active" data-tab="today">📅 Today</button>
      <button class="tab" data-tab="tomorrow">🌅 Tomorrow</button>
      <button class="tab" data-tab="hot">🔥 Hot Pick</button>
      <button class="tab" data-tab="big">🏆 Big Festivals</button>
      <button class="tab" data-tab="doubles">🎲 Doubles & Accas</button>
      <button class="tab" data-tab="leaderboard">🏅 Leaderboard</button>
    </div>

    <div id="content"><p style="color:#94a3b8;text-align:center;padding:2rem">Loading tips…</p></div>
    <div class="footer">Free personal project · Bet responsibly (18+)</div>
  </div>

<script>
const BOTS = {
  FormFox:        { name: "FormFox",        colour: "#3b82f6" },
  HotTrainer:     { name: "HotTrainer",     colour: "#ef4444" },
  BloodlineBetty: { name: "BloodlineBetty", colour: "#ec4899" },
  DevilAdvocate:  { name: "DevilAdvocate",  colour: "#a855f7" },
  PlaceHunter:    { name: "PlaceHunter",    colour: "#14b8a6" }
};

let todayData = null;
let tomorrowData = null;
let currentTab = "today";

function getDateOffset(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

async function fetchTipsForDate(dateStr) {
  const paths = [
    `./tips-${dateStr}.json`,
    `tips-${dateStr}.json`,
    `./data/tips-${dateStr}.json`
  ];
  for (const path of paths) {
    try {
      const res = await fetch(path + "?t=" + Date.now());
      if (!res.ok) continue;
      const data = await res.json();
      if (data && Array.isArray(data.races) && data.races.length > 0) return data;
    } catch (e) {}
  }
  return null;
}

async function loadTips() {
  const todayStr = getDateOffset(0);
  const tomorrowStr = getDateOffset(1);
  try {
    todayData = await fetchTipsForDate(todayStr);
  } catch (e) { console.error(e); }
  try {
    tomorrowData = await fetchTipsForDate(tomorrowStr);
  } catch (e) { console.error(e); }
}

function updateHeaderDate(dateStr) {
  const el = document.getElementById("header-meta");
  if (!el) return;
  try {
    const formatted = new Date(dateStr + "T12:00:00").toLocaleDateString("en-GB", {
      weekday: "long", day: "numeric", month: "long", year: "numeric"
    });
    el.textContent = "UK & Ireland · " + formatted;
  } catch (e) {
    el.textContent = "UK & Ireland · " + dateStr;
  }
}

function confClass(c) {
  if (c >= 60) return "conf-high";
  if (c >= 45) return "conf-mid";
  return "conf-low";
}

function renderStars(n) {
  n = Number(n) || 0;
  if (n < 2) return "";
  return "★".repeat(Math.min(n, 6));
}

function groupByMeeting(races) {
  const map = {};
  (races || []).forEach(r => {
    const c = r.course || "Unknown";
    if (!map[c]) map[c] = [];
    map[c].push(r);
  });
  return map;
}

function renderRacecards(dataSet) {
  if (!dataSet || !dataSet.races || dataSet.races.length === 0) {
    const note = (dataSet && dataSet.note) ? dataSet.note : "";
    const unpublished = dataSet && dataSet.published === false;
    if (unpublished || note) {
      return '<div class="data-warn"><strong>' + (unpublished ? "Tomorrow's card not on our feed yet" : "Notice") +
        "</strong><br>" + (note || "Racecards for this date are not available from the feed yet. Check back later — tips will appear once real runners are published.") +
        "</div>";
    }
    return '<p style="color:#94a3b8;text-align:center;padding:2.5rem">No tips available for this date yet.</p>';
  }
  const meetings = groupByMeeting(dataSet.races);
  let html = "";
  if (dataSet.note) {
    html += '<div class="data-warn">' + dataSet.note + "</div>";
  }
  Object.keys(meetings).sort().forEach(course => {
    const goings = [...new Set((meetings[course] || []).map(r => (r.going || "").trim()).filter(Boolean))];
    let goingHtml = "";
    if (goings.length) {
      const g = goings[0];
      const gl = g.toLowerCase();
      let gcls = "";
      if (/heavy|soft|yielding/.test(gl)) gcls = "soft";
      else if (/firm|hard/.test(gl)) gcls = "firm";
      if (/heavy/.test(gl)) gcls = "heavy";
      goingHtml = '<span class="going-banner ' + gcls + '">' + g + '</span>';
    }
    html += '<div class="meeting">' +
      '<div class="meeting-header" onclick="this.parentElement.classList.toggle(\'open\')">' +
      '<span>' + course + goingHtml + '</span><span class="chevron">▶</span></div>' +
      '<div class="meeting-body">';
    meetings[course].forEach(race => {
      const rg = (race.going || "").trim();
      const dist = (race.distance || "").trim();
      const extra = [rg, dist].filter(Boolean).join(" · ");
      html += '<div class="race"><div class="race-header">' +
        '<span class="race-time">' + (race.time || "") + '</span>' +
        '<span class="race-name">' + (race.name || "") + (extra ? ' <span style="color:#94a3b8;font-weight:400;font-size:0.85em">· ' + extra + '</span>' : '') + '</span></div>';
      // WHAT TO BACK — race consensus
      const cons = race.consensus;
      if (cons && cons.horse) {
        const strength = cons.strength || (cons.bot_count >= 4 ? "strong" : cons.bot_count >= 3 ? "solid" : cons.bot_count >= 2 ? "lean" : "split");
        const label = strength === "strong" ? "BACK THIS · Strong consensus"
          : strength === "solid" ? "BACK THIS · Solid consensus"
          : strength === "lean" ? "Lean tip · 2 bots agree"
          : "Slight edge · bots split";
        html += '<div class="consensus-bar ' + strength + '">' +
          '<div><div class="c-label">' + label + '</div>' +
          '<div class="c-horse">' + cons.horse +
          (cons.type === "ew" ? ' <span class="ew-flag">E/W</span>' : '') +
          '</div></div>' +
          '<div class="c-meta"><b>' + (cons.bot_count || 0) + ' bots</b> · conf ' + (cons.avg_conf || "?") +
          ' · ' + (cons.type || "win") + ' @ ' + (cons.odds || "?") + '</div>' +
          '<div class="c-meta" style="width:100%;font-size:0.8rem">' + (cons.bots || []).join(", ") + '</div>' +
          '</div>';
      }
      html += '<div class="col-headers"><div>Bot</div><div>Horse</div>' +
        '<div style="text-align:center">Stars</div><div style="text-align:right">Odds</div>' +
        '<div style="text-align:center">Conf</div></div>';
      (race.tips || []).forEach(t => {
        const bot = BOTS[t.bot] || { name: t.bot, colour: "#64748b" };
        html += '<div class="tip" onclick="this.classList.toggle(\'open\')">' +
          '<span class="bot-badge" style="background:' + bot.colour + '">' + bot.name + '</span>' +
          '<span class="horse-name">' + t.horse + (t.type === "ew" ? '<span class="ew-flag">E/W</span>' : "") + '</span>' +
          '<span class="stars">' + renderStars(t.stars) + '</span>' +
          '<span class="odds">' + Number(t.odds).toFixed(2) + '</span>' +
          '<span class="confidence ' + confClass(t.conf) + '">' + t.conf + '%</span>' +
          '<div class="reason-panel"><strong>' + bot.name + ':</strong> ' + (t.reason || "No reasoning available.") + '</div>' +
          '</div>';
      });
      html += '</div>';
    });
    html += '</div></div>';
  });
  return html;
}

function getHotPick(dataSet) {
  if (!dataSet) return null;
  // Prefer server-built hot_picks (3+ bots, conf floor)
  if (Array.isArray(dataSet.hot_picks) && dataSet.hot_picks.length) {
    return dataSet.hot_picks[0];
  }
  // Fallback: aggregate from race tips
  const tallies = {};
  (dataSet.races || []).forEach(function (race) {
    (race.tips || []).forEach(function (t) {
      const key = (race.course || "") + "|" + (race.time || "") + "|" + (t.horse || "");
      if (!tallies[key]) {
        tallies[key] = {
          horse: t.horse,
          course: race.course,
          time: race.time,
          race: race.name,
          odds: t.odds,
          bots: [],
          confs: [],
          type: t.type
        };
      }
      tallies[key].bots.push(t.bot);
      tallies[key].confs.push(t.conf || 0);
    });
  });
  let best = null;
  Object.keys(tallies).forEach(function (k) {
    const v = tallies[k];
    const n = v.bots.length;
    const avg = v.confs.reduce(function (a, b) { return a + b; }, 0) / Math.max(1, n);
    if (n < 3 || avg < 55) return;
    const score = n * 10 + avg;
    if (!best || score > best.score) {
      best = {
        horse: v.horse,
        course: v.course,
        time: v.time,
        race: v.race,
        odds: v.odds,
        bot_count: n,
        avg_conf: Math.round(avg * 10) / 10,
        bots: v.bots,
        type: v.type,
        score: score
      };
    }
  });
  return best;
}

function renderHotPick() {
  const list = (todayData && Array.isArray(todayData.hot_picks)) ? todayData.hot_picks : null;
  if (list && list.length) {
    let html = '<div class="section-title">Daily Hot Picks</div><p style="color:#94a3b8;text-align:center;font-size:0.85rem;margin:0 0 1rem">3+ bots agreed · avg confidence ≥ 55</p>';
    list.slice(0, 8).forEach(function (hot) {
      html += '<div class="card hot-pick"><h3>' + (hot.horse || "") + '</h3>' +
        '<div style="color:#94a3b8;font-size:0.9rem">' + (hot.course || "") + " " + (hot.time || "") +
        (hot.race ? " · " + hot.race : "") + "</div>" +
        '<div style="margin-top:0.5rem"><b>' + (hot.bot_count || (hot.bots || []).length) + " bots</b> · avg conf " +
        (hot.avg_conf || "?") + " · " + (hot.type || "win") + " @ " + (hot.odds || "?") + "</div>" +
        '<div style="margin-top:0.35rem;font-size:0.85rem;color:#cbd5e1">' + (hot.bots || []).join(", ") + "</div></div>";
    });
    return html;
  }
  const hot = getHotPick(todayData);
  if (!hot) return '<p style="color:#94a3b8;text-align:center;padding:2rem">No hot pick available yet (need 3+ bots on one horse with solid confidence).</p>';
  return '<div class="section-title">Today’s Hot Pick</div>' +
    '<div class="card hot-pick"><h3>' + hot.horse + '</h3>' +
    '<div style="color:#94a3b8">' + (hot.course || "") + " " + (hot.time || "") + "</div>" +
    '<div style="margin-top:0.5rem"><b>' + (hot.bot_count || 0) + " bots</b> · conf " + (hot.avg_conf || "") +
    " · " + (hot.type || "win") + " @ " + (hot.odds || "") + "</div></div>";
}

function topSelections(dataSet, typeFilter, limit) {
  if (!dataSet || !dataSet.races) return [];
  const picks = [];
  dataSet.races.forEach(race => {
    const byHorse = {};
    (race.tips || []).forEach(t => {
      if (typeFilter && t.type !== typeFilter) return;
      if (!byHorse[t.horse]) byHorse[t.horse] = { horse: t.horse, course: race.course, time: race.time, odds: t.odds, conf: 0, count: 0 };
      byHorse[t.horse].conf += Number(t.conf) || 0;
      byHorse[t.horse].count += 1;
      byHorse[t.horse].odds = t.odds;
    });
    Object.values(byHorse).forEach(p => { p.avg = p.conf / p.count; picks.push(p); });
  });
  picks.sort((a, b) => b.count - a.count || b.avg - a.avg);
  const seen = new Set(); const unique = [];
  for (const p of picks) {
    if (seen.has(p.horse)) continue;
    seen.add(p.horse); unique.push(p);
    if (unique.length >= limit) break;
  }
  return unique;
}

function renderDoubles() {
  const winPicks = topSelections(todayData, "win", 8);
  const ewPicks = topSelections(todayData, "ew", 8);
  const allPicks = topSelections(todayData, null, 10);
  function combo(list, n, label) {
    if (list.length < n) return '<div class="card"><h3>' + label + '</h3><p>Not enough selections yet.</p></div>';
    const chosen = list.slice(0, n);
    const names = chosen.map(p => p.horse + " (" + p.course + " " + p.time + ")").join(" + ");
    const odds = chosen.reduce((a, p) => a * (Number(p.odds) || 2), 1);
    return '<div class="card"><h3>' + label + '</h3><p>' + names +
      '</p><p style="margin-top:0.35rem;color:#94a3b8;font-size:0.85rem">Approx combined odds: ' + odds.toFixed(1) + '</p></div>';
  }
  return '<div class="section-title">Doubles & Accas</div>' +
    combo(winPicks, 2, "Winners Double") +
    combo(ewPicks, 2, "Each-Way Double") +
    combo(winPicks, 3, "Winners Treble") +
    combo(ewPicks, 3, "Each-Way Treble") +
    combo(allPicks, 6, "6-Fold (mixed)") +
    '<p style="color:#94a3b8;font-size:0.85rem;margin-top:1rem">From strongest bot consensus. Check current odds.</p>';
}

async function  {

      if (s.last_settled) parts.push("Last settled: <b style=\"color:#e2e8f0\">" + s.last_settled + "</b>");
      if (s.best_roi) parts.push("Best ROI: <b style=\"color:#4ade80\">" + s.best_roi + "</b>");
      if (s.settled_days != null) parts.push(s.settled_days + " days tracked");
      el.innerHTML = parts.join(" · ") || "Status ready";

async function fillLeaderboard(period) {
  const root = document.getElementById("lb-root");
  const loading = document.getElementById("lb-loading");
  if (!root) {
    console.warn("fillLeaderboard: #lb-root missing");
    return;
  }
  period = period || window._lbPeriod || "all";
  window._lbPeriod = period;

  let data = window._lbData || null;
  if (!data) {
    try {
      const res = await fetch("./leaderboard.json?t=" + Date.now());
      if (!res.ok) throw new Error("HTTP " + res.status);
      data = await res.json();
      window._lbData = data;
    } catch (e) {
      console.error("fillLeaderboard fetch failed", e);
      if (loading) loading.remove();
      root.innerHTML = '<p style="color:#f87171;text-align:center;padding:1.5rem">Could not load leaderboard.json (' + e.message + ').</p>';
      return;
    }
  }
  if (loading) loading.remove();

  let slice = null;
  if (data.periods && data.periods[period]) {
    slice = data.periods[period];
  } else if (period === "all" && data.bots) {
    slice = { bots: data.bots, best_roi: data.best_roi, best_win: data.best_win };
  }
  if (!slice || !slice.bots) {
    root.innerHTML = '<p style="color:#94a3b8;text-align:center;padding:1.5rem">No settled results yet for this period.</p>';
    return;
  }

  const bots = slice.bots;
  const ACTIVE = ["FormFox","HotTrainer","BloodlineBetty","DevilAdvocate","PlaceHunter"];
  const ranked = Object.keys(bots).filter(id => ACTIVE.indexOf(id) >= 0).map(id => {
    const b = bots[id];
    return { id: id, b: b, roi: b.roi_pct != null ? b.roi_pct : 0, win: b.win_pct != null ? b.win_pct : 0, tips: b.tips || 0 };
  }).sort((a, c) => c.roi - a.roi);

  const bestRoi = slice.best_roi || (ranked.filter(x => x.tips >= 5)[0] || ranked[0] || {}).id;
  let bestWin = slice.best_win;
  if (!bestWin) {
    const byWin = ranked.slice().filter(x => x.tips >= 5).sort((a, c) => c.win - a.win);
    bestWin = (byWin[0] || ranked[0] || {}).id;
  }

  const bestRoiBot = BOTS[bestRoi] || { name: bestRoi || "—", colour: "#64748b" };
  const bestWinBot = BOTS[bestWin] || { name: bestWin || "—", colour: "#64748b" };
  const bestRoiStats = bestRoi && bots[bestRoi] ? bots[bestRoi] : null;
  const bestWinStats = bestWin && bots[bestWin] ? bots[bestWin] : null;

  const hist = (data.history || []).slice(-14);
  let spark = "";
  if (hist.length) {
    const maxAbs = Math.max(1, ...hist.map(h => Math.abs(Number(h.pnl) || 0)));
    spark = '<div style="margin:0.5rem 0 0.25rem;color:#94a3b8;font-size:0.8rem">Daily P&amp;L (all bots combined, last ' + hist.length + ' days)</div>' +
      '<div class="sparkline">' + hist.map(h => {
        const pnl = Number(h.pnl) || 0;
        const hgt = Math.max(4, Math.round(36 * Math.abs(pnl) / maxAbs));
        const cls = pnl > 0 ? "pos" : (pnl < 0 ? "neg" : "");
        return '<span class="' + cls + '" style="height:' + hgt + 'px" title="' + (h.date || "") + ': ' + (pnl >= 0 ? "+" : "") + pnl + '"></span>';
      }).join("") + '</div>' +
      '<div style="display:flex;justify-content:space-between;color:#64748b;font-size:0.7rem">' +
        '<span>' + (hist[0].date || "") + '</span><span>' + (hist[hist.length - 1].date || "") + '</span></div>';
  }

  const hot = data.hot_pick || null;
  let hotHtml = "";
  if (hot && hot.n) {
    const roiCls = (hot.roi_pct || 0) >= 0 ? "lb-roi-pos" : "lb-roi-neg";
    hotHtml = '<div class="hot-card"><h3>🔥 Consensus Hot Pick track record</h3>' +
      '<div style="display:flex;flex-wrap:wrap;gap:1rem;align-items:baseline">' +
        '<div><span style="color:#94a3b8;font-size:0.8rem">Settled</span><div style="font-weight:700;font-size:1.1rem">' + hot.n + '</div></div>' +
        '<div><span style="color:#94a3b8;font-size:0.8rem">Win%</span><div style="font-weight:700;font-size:1.1rem">' + (hot.win_pct || 0) + '%</div></div>' +
        '<div><span style="color:#94a3b8;font-size:0.8rem">ROI</span><div class="' + roiCls + '" style="font-size:1.1rem">' + ((hot.roi_pct || 0) >= 0 ? "+" : "") + (hot.roi_pct || 0) + '%</div></div>' +
        '<div><span style="color:#94a3b8;font-size:0.8rem">P&amp;L</span><div style="font-weight:700">' + ((hot.pnl || 0) >= 0 ? "+" : "") + (hot.pnl || 0) + '</div></div>' +
      '</div>' +
      '<p style="color:#94a3b8;font-size:0.78rem;margin-top:0.45rem">Horses where 3+ bots agreed · level £1 win stakes</p></div>';
  }

  const podium =
    '<div class="lb-podium">' +
      '<div class="lb-podium-card">' +
        '<h3>🏆 Best ROI</h3>' +
        '<div class="val"><span class="bot-badge" style="background:' + bestRoiBot.colour + '">' + bestRoiBot.name + '</span> ' +
        (bestRoiStats ? '<span class="lb-roi-pos">+' + (bestRoiStats.roi_pct || 0) + '%</span>' : '—') + '</div>' +
        (bestRoiStats ? '<div style="color:#94a3b8;font-size:0.8rem;margin-top:0.25rem">' + (bestRoiStats.tips || 0) + ' tips · Win ' + (bestRoiStats.win_pct || 0) + '%</div>' : '') +
      '</div>' +
      '<div class="lb-podium-card">' +
        '<h3>🎯 Best strike rate</h3>' +
        '<div class="val"><span class="bot-badge" style="background:' + bestWinBot.colour + '">' + bestWinBot.name + '</span> ' +
        (bestWinStats ? (bestWinStats.win_pct || 0) + '%' : '—') + '</div>' +
        (bestWinStats ? '<div style="color:#94a3b8;font-size:0.8rem;margin-top:0.25rem">' + (bestWinStats.tips || 0) + ' tips · ROI ' + ((bestWinStats.roi_pct || 0) >= 0 ? '+' : '') + (bestWinStats.roi_pct || 0) + '%</div>' : '') +
      '</div>' +
    '</div>';

  const rows = ranked.map((row, idx) => {
    const b = row.b;
    const bot = BOTS[row.id] || { name: row.id, colour: "#64748b" };
    const roi = row.roi;
    const cls = [];
    if (row.id === bestRoi) cls.push("lb-best-roi");
    if (row.id === bestWin) cls.push("lb-best-win");
    let pills = "";
    if (row.id === bestRoi) pills += '<span class="lb-pill lb-pill-gold">BEST ROI</span>';
    if (row.id === bestWin) pills += '<span class="lb-pill lb-pill-blue">BEST WIN%</span>';
    if (idx === 0) pills += '<span class="lb-crown">👑</span>';
    const roiCls = roi >= 0 ? "lb-roi-pos" : "lb-roi-neg";
    return '<tr class="' + cls.join(" ") + '">' +
      '<td><span class="bot-badge" style="background:' + bot.colour + '">' + bot.name + '</span>' + pills + '</td>' +
      '<td>' + (b.tips || 0) + '</td>' +
      '<td>' + (b.win_pct != null ? b.win_pct : 0) + '%</td>' +
      '<td class="' + roiCls + '">' + (roi >= 0 ? "+" : "") + roi + '%</td>' +
      '<td>' + (b.avg_odds || 0) + '</td>' +
      '<td>W ' + (b.style && b.style.win || 0) + ' / EW ' + (b.style && b.style.ew || 0) + '</td></tr>';
  }).join("");

  let calHtml = '<div style="margin:1rem 0 0.35rem;color:#94a3b8;font-size:0.8rem">Confidence calibration (did high-conf tips actually win more?)</div><div class="cal-grid">';
  let hasCal = false;
  ranked.forEach(row => {
    const conf = row.b.conf || {};
    const low = conf.low || {};
    const mid = conf.mid || {};
    const high = conf.high || {};
    if (!(low.n || mid.n || high.n)) return;
    hasCal = true;
    const bot = BOTS[row.id] || { name: row.id, colour: "#64748b" };
    calHtml += '<div class="cal-card"><span class="bot-badge" style="background:' + bot.colour + '">' + bot.name + '</span>' +
      '<div style="margin-top:0.45rem;display:flex;justify-content:space-between;gap:0.35rem">' +
        '<div><div class="lbl">&lt;55%</div><div class="num">' + (low.win_pct != null ? low.win_pct : "—") + '%</div><div class="lbl">' + (low.n || 0) + ' tips</div></div>' +
        '<div><div class="lbl">55–69%</div><div class="num">' + (mid.win_pct != null ? mid.win_pct : "—") + '%</div><div class="lbl">' + (mid.n || 0) + ' tips</div></div>' +
        '<div><div class="lbl">70%+</div><div class="num">' + (high.win_pct != null ? high.win_pct : "—") + '%</div><div class="lbl">' + (high.n || 0) + ' tips</div></div>' +
      '</div></div>';
  });
  calHtml += '</div>';
  if (!hasCal) calHtml = "";

  const periodLabel = { all: "All time", week: "Last 7 days", month: "Last 30 days", year: "Last 365 days" }[period] || period;
  root.innerHTML =
    podium +
    hotHtml +
    spark +
    '<p style="color:#94a3b8;font-size:0.85rem;margin:0.75rem 0">Showing: <strong style="color:#e2e8f0">' + periodLabel + '</strong> · Updated: ' + (data.updated_at || "—") + ' · Level £1 stakes</p>' +
    '<table class="lb-table" style="width:100%;border-collapse:collapse;font-size:0.9rem">' +
    '<thead><tr style="color:#94a3b8;text-align:left"><th>Bot</th><th>Tips</th><th>Win%</th><th>ROI</th><th>Avg odds</th><th>Style</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
    calHtml;

  const tabs = document.getElementById("lb-period-tabs");
  if (tabs && !tabs._wired) {
    tabs._wired = true;
    tabs.addEventListener("click", function(e) {
      const btn = e.target.closest("button[data-period]");
      if (!btn) return;
      tabs.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      fillLeaderboard(btn.dataset.period);
    });
  }
  if (tabs) {
    tabs.querySelectorAll("button").forEach(b => {
      b.classList.toggle("active", b.dataset.period === period);
    });
  }
}

function renderContent() {
  const el = document.getElementById("content");
  if (!el) return;
  if (currentTab === "today") {
    updateHeaderDate((todayData && todayData.date) || getDateOffset(0));
    el.innerHTML = renderRacecards(todayData);
  } else if (currentTab === "tomorrow") {
    updateHeaderDate((tomorrowData && tomorrowData.date) || getDateOffset(1));
    el.innerHTML = renderRacecards(tomorrowData);
  } else if (currentTab === "hot") {
    updateHeaderDate((todayData && todayData.date) || getDateOffset(0));
    el.innerHTML = renderHotPick();
  } else if (currentTab === "big") {
    el.innerHTML = renderBigFestivals();
  } else if (currentTab === "doubles") {
    el.innerHTML = renderDoubles();
  } else if (currentTab === "leaderboard") {
    el.innerHTML = renderLeaderboard();
    // must run after DOM nodes exist
    setTimeout(fillLeaderboard, 0);
  }
}

document.getElementById("main-tabs").addEventListener("click", function(e) {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  currentTab = btn.dataset.tab;
  renderContent();
});

(async function() {
  try {
    await loadTips();
  } catch (e) {
    console.error(e);
  }
  renderContent();
})();
