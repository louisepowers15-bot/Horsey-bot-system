<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horse Racing Bot Chat</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --card-hover: #334155;
      --text: #e2e8f0; --muted: #94a3b8; --border: #334155; --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 1rem; }
    header { text-align: center; padding: 1.25rem 0 0.75rem; }
    header h1 {
      font-size: 1.7rem; font-weight: 700; color: var(--accent);
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    header .meta { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
    .info-box {
      background: #1e3a5f; border: 1px solid #334155; border-radius: 0.75rem;
      padding: 0.85rem 1.1rem; margin: 1rem 0; font-size: 0.88rem; color: #bae6fd;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    .tab {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      padding: 0.45rem 0.95rem; border-radius: 9999px; cursor: pointer; font-size: 0.85rem;
    }
    .tab:hover { background: var(--card-hover); color: var(--text); }
    .tab.active { background: #0ea5e9; color: white; border-color: #0ea5e9; }

    .meeting {
      margin-bottom: 0.75rem; border: 1px solid var(--border);
      border-radius: 0.75rem; overflow: hidden; background: var(--card);
    }
    .meeting-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.9rem 1.1rem; cursor: pointer; background: #1e293b;
      font-size: 1.15rem; font-weight: 650; color: #f1f5f9; user-select: none;
    }
    .meeting-header:hover { background: #273548; }
    .meeting-header .chevron { transition: transform 0.2s; font-size: 1.1rem; color: var(--muted); }
    .meeting.open .meeting-header .chevron { transform: rotate(90deg); }
    .meeting-body { display: none; border-top: 1px solid var(--border); }
    .meeting.open .meeting-body { display: block; }

    .race { border-bottom: 1px solid var(--border); }
    .race:last-child { border-bottom: none; }
    .race-header {
      padding: 0.7rem 1.1rem; font-size: 0.92rem; color: #cbd5e1;
      background: #0f172a; border-bottom: 1px solid #1e293b;
      display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: baseline;
    }
    .race-time { font-weight: 700; color: #38bdf8; font-size: 1rem; }
    .race-name { font-weight: 500; }
    .race-meta { font-size: 0.8rem; color: var(--muted); }

    .col-headers {
      display: grid;
      grid-template-columns: 120px 1fr 80px 60px 55px;
      gap: 0.5rem; padding: 0.45rem 1.1rem;
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--muted); background: #0f172a; border-bottom: 1px solid #1e293b;
    }

    .tip {
      display: grid;
      grid-template-columns: 120px 1fr 80px 60px 55px;
      gap: 0.5rem; align-items: center;
      padding: 0.55rem 1.1rem; border-bottom: 1px solid #1e293b;
      cursor: pointer; transition: background 0.15s;
    }
    .tip:last-child { border-bottom: none; }
    .tip:hover { background: var(--card-hover); }
    .bot-badge {
      font-size: 0.72rem; font-weight: 600; padding: 0.18rem 0.45rem;
      border-radius: 9999px; color: white; text-align: center; white-space: nowrap;
    }
    .horse-name { font-weight: 500; font-size: 0.95rem; }
    .stars { color: #fbbf24; letter-spacing: 1px; font-size: 0.95rem; text-align: center; }
    .odds { font-weight: 600; color: #fbbf24; text-align: right; }
    .confidence {
      font-size: 0.78rem; font-weight: 600; padding: 0.12rem 0.4rem;
      border-radius: 9999px; text-align: center;
    }
    .conf-high { background: #166534; color: #bbf7d0; }
    .conf-mid  { background: #854d0e; color: #fef08a; }
    .conf-low  { background: #7f1d1d; color: #fecaca; }
    .ew-flag {
      font-size: 0.65rem; background: #4c1d95; color: #e9d5ff;
      padding: 0.08rem 0.35rem; border-radius: 4px; margin-left: 0.3rem;
    }

    .reason-panel {
      display: none; grid-column: 1 / -1;
      background: #0f172a; border-top: 1px solid #334155;
      padding: 0.9rem 1.1rem; font-size: 0.88rem; color: #cbd5e1; line-height: 1.55;
    }
    .tip.open .reason-panel { display: block; }
    .reason-panel strong { color: #e2e8f0; }
    .reason-panel ul { margin: 0.4rem 0 0 1.1rem; }
    .reason-panel li { margin-bottom: 0.25rem; }

    .section-title { font-size: 1.15rem; font-weight: 600; margin: 1.25rem 0 0.75rem; color: #f1f5f9; }
    .festival-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem;
      padding: 1rem 1.15rem; margin-bottom: 0.75rem;
    }
    .festival-card h3 { font-size: 1.05rem; color: #38bdf8; margin-bottom: 0.3rem; }
    .festival-card .when { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }
    .festival-card p { font-size: 0.9rem; color: #cbd5e1; }
    .acca-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem;
      padding: 1rem; margin-bottom: 0.75rem;
    }
    .acca-card h3 { font-size: 0.95rem; margin-bottom: 0.4rem; color: #38bdf8; }
    .lb-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .lb-table th, .lb-table td {
      padding: 0.55rem 0.7rem; text-align: left; border-bottom: 1px solid var(--border);
    }
    .lb-table th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
    .footer { text-align: center; padding: 2rem 0; color: var(--muted); font-size: 0.8rem; }
    @media (max-width: 640px) {
      .col-headers, .tip { grid-template-columns: 95px 1fr 60px 50px 48px; }
      .bot-badge { font-size: 0.65rem; }
    }
  </style>
</head>

// Stars = exact number of bots that picked the horse
DATA.meetings.forEach(m => {
  m.races.forEach(r => {
    const counts = {};
    (r.tips || []).forEach(t => { counts[t.horse] = (counts[t.horse] || 0) + 1; });
    (r.tips || []).forEach(t => { t.stars = counts[t.horse] || 1; });
  });
});

let currentTab = "today";

function confClass(c) {
  if (c >= 60) return "conf-high";
  if (c >= 45) return "conf-mid";
  return "conf-low";
}

function renderStars(n) {
  if (!n || n < 2) return "";
  return "★".repeat(Math.min(n, 6));
}

      <div class="meeting-body">`;
    m.races.forEach(race => {
      html += `<div class="race">
        <div class="race-header">
          <span class="race-time">${race.time}</span>
          <span class="race-name">${race.name}</span>
          <span class="race-meta">${race.dist} · ${race.going} · ${race.runners} runners</span>
        </div>
        <div class="col-headers">
          <div>Bot</div><div>Horse</div><div style="text-align:center">Stars</div><div style="text-align:right">Odds</div><div style="text-align:center">Conf</div>
        </div>`;
      (race.tips || []).forEach(t => {
        const bot = BOTS[t.bot] || { name: t.bot, colour: "#64748b" };
        html += `<div class="tip" onclick="toggleReason(this)">
          <span class="bot-badge" style="background:${bot.colour}">${bot.name}</span>
          <span class="horse-name">${t.horse}${t.type === "ew" ? '<span class="ew-flag">E/W</span>' : ""}</span>
          <span class="stars">${renderStars(t.stars)}</span>
          <span class="odds">${Number(t.odds).toFixed(2)}</span>
          <span class="confidence ${confClass(t.conf)}">${t.conf}%</span>
          <div class="reason-panel">${t.reason}</div>
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  return html;
}

function toggleMeeting(mi) {
  DATA.meetings[mi].open = !DATA.meetings[mi].open;
  render();
}

function toggleReason(el) { el.classList.toggle("open"); }

function render() {
  const el = document.getElementById("content");
  if (currentTab === "today") el.innerHTML = renderMeetingList(DATA.meetings);
  else if (currentTab === "tomorrow") el.innerHTML = renderTomorrow();
  else if (currentTab === "big") el.innerHTML = renderBigFestivals();
  else if (currentTab === "doubles") el.innerHTML = renderDoubles();
  else if (currentTab === "leaderboard") el.innerHTML = renderLeaderboard();
}

document.getElementById("main-tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  currentTab = btn.dataset.tab;
  render();
});

render();
